[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/40w-apple-charger-and-apple-cable-combo"
  to = "/charger-cable-combo"
  status = 301

[[redirects]]
  from = "/product/:slug"
  to = "/:slug"
  status = 301

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301
